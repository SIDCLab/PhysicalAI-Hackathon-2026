# Where the objects go in each rollout, and what your policy is told. Sent with: uv run run.py --submit
#
# Only when objects or layout is "different" in submission.yaml. If both are "same", leave it empty: we set up
# the default scene every rollout (8 screws and the yellow bin, as in the twin).
#
# One entry per rollout, as many as "rollouts" in submission.yaml (10 by default).
# Positions: x, y in mm in the robot frame (the same x, y as obs["tcp_pose"]), and an optional yaw in degrees;
# table_plan.png shows the axes and the table. A screw's position is its head, and its yaw points to its tip.
# Several objects of one kind: a list of positions, e.g. screw: [[420, -100, 30], [380, 50, 90]]
#
# rollouts:
#   - objects:                                     # rollout 1
#       screw: [420, -100, 30]
#       bin: [510, 110]
#     prompt: Put the screw into the yellow bin.   # optional; default: task in submission.yaml
#   - objects:                                     # rollout 2
#       screw: [380, 50, 90]
#       bin: [510, 110]
#   ...                                            # up to rollout 10

rollouts: []
